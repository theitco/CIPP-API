name: Deploy CIPP API (Linux)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip project
        run: zip -r cippapi.zip .

      - name: Deploy to Azure Function App
        uses: azure/webapps-deploy@v2
        with:
          app-name: cipp-linux-api
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISH_PROFILE }}
          package: cippapi.zip

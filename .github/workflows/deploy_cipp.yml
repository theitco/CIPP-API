name: Deploy CIPP API

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive -Path * -DestinationPath CIPP.zip -Force

      - name: Deploy to Azure Function App
        shell: pwsh
        run: |
          $profile = "${{ secrets.AZUREAPPSERVICE_PUBLISH_PROFILE }}"
          $user = ($profile | Select-String 'userName="([^"]+)"').Matches.Groups[1].Value
          $pass = ($profile | Select-String 'userPWD="([^"]+)"').Matches.Groups[1].Value
          $publishUrl = ($profile | Select-String 'publishUrl="([^"]+)"').Matches.Groups[1].Value
          $cleanUrl = $publishUrl -replace ':443',''
          $pair = "$user:$pass"
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair))
          Write-Host "Deploying to $cleanUrl"
          Invoke-WebRequest -Uri "https://$cleanUrl/api/zipdeploy" `
            -Headers @{ Authorization = "Basic $auth" } `
            -Method POST `
            -InFile "CIPP.zip" `
            -ContentType "application/octet-stream"

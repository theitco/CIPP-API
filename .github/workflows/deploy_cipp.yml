name: Deploy CIPP API (Linux)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip project
        run: zip -r cippapi.zip .

      - name: Deploy via Kudu ZipDeploy
        run: |
          curl -X POST \
            -u "${{ secrets.AZUREAPPSERVICE_PUBLISH_PROFILE_USERNAME }}:${{ secrets.AZUREAPPSERVICE_PUBLISH_PROFILE_PASSWORD }}" \
            --data-binary @cippapi.zip \
            "https://cipp-linux-api.scm.azurewebsites.net/api/zipdeploy"
